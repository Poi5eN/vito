version: 0.2.0

model:
  architecture: vito-decoder-only

  vocab_size: AUTO

  max_position_embeddings: 512

  hidden_size: 512

  num_hidden_layers: 8

  num_attention_heads: 8

  intermediate_size: 2048

  hidden_dropout_prob: 0.0

  attention_dropout_prob: 0.0

  initializer_range: 0.02

  layer_norm_eps: 0.00001

  tie_word_embeddings: true

training:
  sequence_length: 128

  batch_size: 4

  learning_rate: 0.0001

  weight_decay: 0.01

  max_steps: 500

  warmup_steps: 50

  gradient_clip_norm: 1.0

  seed: 42

  device: auto

  output_dir: experiments/vito-v0.2

evaluation:
  validation_every: 50

  test_after_training: true

  generation_after_training: true

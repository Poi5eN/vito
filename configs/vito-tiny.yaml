# VITO v0.1 — Tiny development configuration

model:
  architecture: decoder_only_transformer

  vocab_size: 12288
  context_length: 512

  hidden_size: 512
  num_layers: 8
  num_attention_heads: 8

  intermediate_size: 2048

  dropout: 0.0

  initializer_range: 0.02

tokenizer:
  type: bpe
  vocab_size: 12288

training:
  seed: 42

  learning_rate: 0.0003
  weight_decay: 0.1

  batch_size: 4
  gradient_accumulation_steps: 8

  max_steps: 1000

  warmup_steps: 100

  evaluation_steps: 100
  save_steps: 100

  mixed_precision: false

data:
  max_sequence_length: 512

experiment:
  name: VITO-EXP-001
  version: 0.1.0

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vito"
version = "0.1.0"
description = "Verification-First Intelligence for Technical Operations"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
    "model",
    "training",
    "inference",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]